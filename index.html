<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Passaporte do Turista — Estudo Técnico</title><style>body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:680px;padding:32px;text-align:center}small{opacity:.7}</style></head><body><div class="box"><h1>Passaporte do Turista</h1><p>Carregando a trilha digital…</p><small>Estudo Técnico · Abraão Henrique</small></div><script src="chunk0.js"></script><script src="chunk1.js"></script><script src="chunk2.js"></script><script src="chunk3.js"></script><script src="chunk4.js"></script><script src="chunk5.js"></script><script src="chunk6.js"></script><script src="chunk7.js"></script><script>(async()=>{try{const b=atob((window.PASS_CHUNKS||[]).join(''));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);if(!('DecompressionStream' in window))throw new Error('Seu navegador precisa ser atualizado para abrir esta versão.');const html=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div class="box"><h1>Não foi possível abrir a trilha</h1><p>'+String(e.message||e)+'</p><p>Abra este link no Chrome, Edge, Firefox ou Safari atualizado.</p></div>';}})();</script></body></html>
